name: CheckNow Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  analyze_and_test:
    name: Code Analysis & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart environment info
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none lib test
        continue-on-error: true

      - name: Run static code analysis (Linter)
        run: flutter analyze lib test --no-fatal-infos

      - name: Execute automated unit & widget tests
        run: flutter test --coverage

      - name: Upload code coverage report (optional)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
